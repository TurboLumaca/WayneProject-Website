# Pulls the running sheet once a day and commits site/src/data/running.json when it changed.
# The commit is what rebuilds the site: Netlify, Vercel or Cloudflare Pages redeploy on every push.
# Setup: repository Settings > Secrets and variables > Actions > New secret
#   RUNNING_SHEET_CSV_URL = the running sheet published as CSV (see site/scripts/fetch-sheets.mjs)
name: Refresh numbers

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the running sheet
        working-directory: site
        env:
          RUNNING_SHEET_CSV_URL: ${{ secrets.RUNNING_SHEET_CSV_URL }}
        run: node scripts/fetch-sheets.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- site/src/data/running.json; then
            echo "No change in the numbers."
          else
            git config user.name "numbers-bot"
            git config user.email "numbers-bot@users.noreply.github.com"
            git add site/src/data/running.json
            git commit -m "Refresh running numbers"
            git push
          fi
